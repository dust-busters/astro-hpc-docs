site_name: ASTRO HPC
site_description: Documentation for the group's astro nodes on the UNIMI INDACO cluster
# After Read the Docs gives you a URL, put it here, e.g.
# site_url: https://astro-hpc.readthedocs.io/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

nav:
  - Home: index.md
  - Getting started:
      - Overview: overview.md
      - Login: login.md
      - Running jobs: running-jobs.md
      - Storage & maintenance: storage.md
  - Software:
      - Python: software/python.md
      - CASA: software/casa.md
      - DISCMINER: software/discminer.md
      - FARGO3D: software/fargo3d.md
